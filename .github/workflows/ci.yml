# Continuous integration: offline tests and Terraform checks on every push and pull request.
# Needs no secrets and makes no LLM calls: the tests use a fake LLM and the ticket API in-process,
# and Terraform only validates the configuration (no Azure login, no plan, no apply).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the offline test suite
        run: python -m pytest -q

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false: no state backend and no Azure credentials are needed to validate.
      - name: Initialise providers
        run: terraform init -backend=false -input=false

      - name: Validate the configuration
        run: terraform validate
